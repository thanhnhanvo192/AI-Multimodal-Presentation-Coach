events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate Limiting configuration: Max 5 uploads per 10 minutes per IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
    limit_req_status 429;

    # Max body size for video uploads (100MB)
    client_max_body_size 100M;

    upstream backend_server {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            proxy_pass http://backend_server/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API routing
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Apply Rate Limiting specifically on Video Upload API
        location /api/v1/presentations/upload {
            limit_req zone=upload_limit burst=2 nodelay;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://backend_server/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_server/openapi.json;
            proxy_set_header Host $host;
        }

        # Static media files (uploaded videos)
        location /uploads/ {
            proxy_pass http://backend_server/uploads/;
        }
    }
}
