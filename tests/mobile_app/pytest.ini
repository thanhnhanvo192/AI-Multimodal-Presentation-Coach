[pytest]
testpaths = tests/mobile_app
pythonpath = . tests/mobile_app
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    mobile_login: Tests for Mobile App Login flow, UI and Auth logic
    mobile_signup: Tests for Mobile App Sign Up flow, Validation and Database
addopts = -v --html=reports/mobile_test_report.html --self-contained-html
