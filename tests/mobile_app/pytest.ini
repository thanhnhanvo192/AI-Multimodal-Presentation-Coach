[pytest]
testpaths = tests/mobile_app
pythonpath = . tests/mobile_app
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    mobile_ui: Tests for mobile UI, responsive layout, gestures and keyboard
    mobile_validation: Tests for input fields and validation logic
    mobile_security: Tests for authentication, passwords, and security
    mobile_media: Tests for camera permissions and avatar upload
addopts = -v --html=reports/mobile_test_report.html --self-contained-html
