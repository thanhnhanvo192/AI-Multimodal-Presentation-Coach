services:
  db:
    image: postgres:15-alpine
    container_name: pbl6_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pbl6_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pbl6_password}
      POSTGRES_DB: ${POSTGRES_DB:-pbl6_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pbl6_user} -d ${POSTGRES_DB:-pbl6_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pbl6_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbl6_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pbl6_user}:${POSTGRES_PASSWORD:-pbl6_password}@db:5432/${POSTGRES_DB:-pbl6_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-pbl6-2026}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pbl6_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
